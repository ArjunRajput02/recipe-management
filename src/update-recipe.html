<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update Recipe</title>
    <link href="main.css" rel="stylesheet" />
  </head>

  <!--Body Structure-->
  <body onload="loadRecipe()">
    <div class="min-h-screen flex items-center justify-center bg-gray-100">
      <div class="w-1/2 p-8 bg-amber-50">
        <h2 class="text-xl font-semibold text-center mb-6">Update Recipe</h2>
        <!--Form for update Data-->
        <form class="space-y-4" onsubmit="updateRecipe(event)">
          <input type="hidden" id="id" />

          <input
            type="text"
            id="name"
            placeholder="Recipe Name"
            class="w-full border rounded-md px-3 py-2"
            required
          />

          <input
            type="text"
            id="type"
            placeholder="Recipe Type"
            class="w-full border rounded-md px-3 py-2"
            required
          />

          <input
            type="text"
            id="description"
            placeholder="Description"
            class="w-full border rounded-md px-3 py-2"
            required
          />

          <button
            type="submit"
            class="bg-blue-500 w-full text-white px-4 py-2 rounded-md"
          >
            Update Recipe
          </button>
        </form>
      </div>
    </div>
    <!--External Js File-->
    <script src="global.js"></script>
  </body>
</html>
